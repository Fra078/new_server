x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-env: &env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

# Bind verso il NAS: se il NAS non è montato il container NON parte
# (invece di partire su una cartella vuota). Vedi host/scripts/nas-*.sh
x-media: &media
  type: bind
  source: ${MEDIA_PATH}
  target: /data
  bind: { create_host_path: false }

x-nas: &nas
  homeserver.requires-nas: "true"

services:
  lidarr:
    # nightly: necessario per i plugin (Tubifarry, Deemix)
    image: lscr.io/linuxserver/lidarr:nightly-4.0.0.5222-ls226@sha256:80b85c9c4dbf8738812cc4b30a2053b26f8f71756e173301a827b5de9c9123c8
    container_name: lidarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/lidarr:/config
      - *media
    ports:
      - "127.0.0.1:8686:8686"
    networks: [media_net]
    labels: *nas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8686/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5.5327-ls148@sha256:2489c6dbaf11e3a6d71aeb2e6980d04193d4af611aa7064a974851222fd41722
    container_name: prowlarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks: [media_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/radarr:/config
      - *media
    ports:
      - "127.0.0.1:7878:7878"
    networks: [media_net]
    labels: *nas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17.2952-ls312@sha256:0b5c4803f92456fb9b65bae8375716ea120b4ea17b3cced7da32b63f0085782b
    container_name: sonarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/sonarr:/config
      - *media
    ports:
      - "127.0.0.1:8989:8989"
    networks: [media_net]
    labels: *nas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
