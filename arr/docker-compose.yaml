x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-env: &env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

# Bind verso il NAS: se il NAS non è montato il container NON parte
# (invece di partire su una cartella vuota). Vedi host/scripts/nas-*.sh
x-media: &media
  type: bind
  source: ${MEDIA_PATH}
  target: /data
  bind: { create_host_path: false }

x-nas: &nas
  homeserver.requires-nas: "true"

services:
  lidarr:
    # nightly: necessario per i plugin (Tubifarry, Deemix)
    image: lscr.io/linuxserver/lidarr:nightly-3.1.3.4970-ls202
    container_name: lidarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/lidarr:/config
      - *media
    ports:
      - "127.0.0.1:8686:8686"
    networks: [media_net]
    labels: *nas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8686/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5.5327-ls148
    container_name: prowlarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/prowlarr:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks: [media_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1.10360-ls304
    container_name: radarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/radarr:/config
      - *media
    ports:
      - "127.0.0.1:7878:7878"
    networks: [media_net]
    labels: *nas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17.2952-ls312
    container_name: sonarr
    environment: *env
    volumes:
      - ${APPDATA}/arr/sonarr:/config
      - *media
    ports:
      - "127.0.0.1:8989:8989"
    networks: [media_net]
    labels: *nas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
