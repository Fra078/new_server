# Quando si attiva la VPN, vedere gluetun.example.yaml in questa cartella.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.1_v2.0.12-ls459
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - type: bind
        source: ${MEDIA_PATH}
        target: /data
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:9617:8080"
    networks: [media_net]
    labels:
      homeserver.requires-nas: "true"
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
