x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    ports:
      - "1883:1883" # resta in LAN per i dispositivi IoT (autenticazione obbligatoria)
    volumes:
      - ${APPDATA}/homeassistant/mosquitto/config:/mosquitto/config
      - ${APPDATA}/homeassistant/mosquitto/data:/mosquitto/data
      - ${APPDATA}/homeassistant/mosquitto/log:/mosquitto/log
    logging: *logging
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.2
    container_name: homeassistant
    # privileged + host network: necessari per Bluetooth, mDNS/discovery e dispositivi locali
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ}
      DISABLE_JEMALLOC: "true"
    volumes:
      - ${APPDATA}/homeassistant/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging: *logging
    restart: unless-stopped
