x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    container_name: mosquitto
    ports:
      - "1883:1883" # resta in LAN per i dispositivi IoT (autenticazione obbligatoria)
    volumes:
      - ${APPDATA}/homeassistant/mosquitto/config:/mosquitto/config
      - ${APPDATA}/homeassistant/mosquitto/data:/mosquitto/data
      - ${APPDATA}/homeassistant/mosquitto/log:/mosquitto/log
    logging: *logging
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
    container_name: homeassistant
    # privileged + host network: necessari per Bluetooth, mDNS/discovery e dispositivi locali
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/homeassistant/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging: *logging
    restart: unless-stopped
