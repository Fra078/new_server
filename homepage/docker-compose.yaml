x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.1
    container_name: homepage
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - ${APPDATA}/homepage/homepage:/app/config
      # /mnt in sola lettura con propagazione: vede il NAS quando è montato
      # senza dipenderne (widget spazio disco su /mnt/host/mycloud).
      - type: bind
        source: /mnt
        target: /mnt/host
        read_only: true
        bind: { propagation: rslave }
    # Docker via socket-proxy (config/docker.yaml -> host: socket-proxy, port: 2375)
    ports:
      - "127.0.0.1:3000:3000"
    networks: [media_net, socket_net, mgmt_net]
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
  socket_net:
    name: socket_net
    external: true
  mgmt_net:
    name: mgmt_net
    external: true
