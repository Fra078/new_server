x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.0ubu2604-ls48@sha256:0f42497a69fa0441bfd5f9d6bba8694f2a656ec984e571d0ac04c6dd91250039
    container_name: jellyfin
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/media/jellyfin:/config
      - type: bind
        source: ${MEDIA_PATH}/media
        target: /data/media
        bind: { create_host_path: false }
    ports:
      - "8096:8096" # resta in LAN (TV) oltre che via Tailscale
    networks: [media_net]
    labels:
      homeserver.requires-nas: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/jellyfin/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 3m
    logging: *logging
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      ND_SCANINTERVAL: 15m # scansione via CIFS: ogni minuto era un carico costante sul NAS
    volumes:
      - ${APPDATA}/media/navidrome:/data
      - type: bind
        source: ${MEDIA_PATH}/media/music
        target: /music
        read_only: true
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:4533:4533"
    networks: [media_net]
    labels:
      homeserver.requires-nas: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
