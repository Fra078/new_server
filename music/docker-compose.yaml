x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-env: &env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-media: &media
  type: bind
  source: ${MEDIA_PATH}
  target: /data
  bind: { create_host_path: false }

x-nas: &nas
  homeserver.requires-nas: "true"

services:
  deemix:
    image: ghcr.io/bambanah/deemix:v4.5.2
    container_name: deemix
    environment: *env
    volumes:
      - ${APPDATA}/music/deemix:/config
      - *media
    ports:
      - "127.0.0.1:6595:6595"
    networks: [media_net]
    labels: *nas
    logging: *logging
    restart: unless-stopped

  slskd:
    image: slskd/slskd:0.25.1
    container_name: slskd
    environment:
      <<: *env
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - ${APPDATA}/music/slskd:/app/config
      - *media
    ports:
      - "127.0.0.1:5030:5030"
    networks: [media_net]
    labels: *nas
    logging: *logging
    restart: unless-stopped

  lidarr-downloader:
    image: angrido/lidarr-downloader:latest@sha256:8cd0a8dda8d915383d05d1907700c66aca77e6f1fd70a8e1a08d1d4dcc4c0d6e
    container_name: lidarr-downloader
    environment:
      <<: *env
      LIDARR_URL: http://lidarr:8686
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      DOWNLOAD_PATH: /data/downloads/youtube
      LIDARR_PATH: /data/media/music
    volumes:
      - ${APPDATA}/music/lidarr-downloader:/config
      - *media
    ports:
      - "127.0.0.1:5005:5000"
    networks: [media_net]
    labels: *nas
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
