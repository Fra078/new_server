x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-env: &env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-media: &media
  type: bind
  source: ${MEDIA_PATH}
  target: /data
  bind: { create_host_path: false }

x-nas: &nas
  homeserver.requires-nas: "true"

services:
  deemix:
    image: ghcr.io/bambanah/deemix:v4.5.2@sha256:cd53202a41e77066419af2af9e1ff68b2d68682df3698e6a5e84d9b29a12912d
    container_name: deemix
    environment: *env
    volumes:
      - ${APPDATA}/music/deemix:/config
      - *media
    ports:
      - "127.0.0.1:6595:6595"
    networks: [media_net]
    labels: *nas
    logging: *logging
    restart: unless-stopped

  slskd:
    image: slskd/slskd:0.25.1@sha256:ab9ed50e028b524cefdb7c1dd8ebca368a076e18441ee8ac2326473eb850b4c3
    container_name: slskd
    environment:
      <<: *env
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - ${APPDATA}/music/slskd:/app/config
      - *media
    ports:
      - "127.0.0.1:5030:5030"
    networks: [media_net]
    labels: *nas
    logging: *logging
    restart: unless-stopped

  lidarr-downloader:
    image: angrido/lidarr-downloader:latest@sha256:7df4fdf96a95b54416cb43e63c42ebb8747e0f1a71638541f2b1154df70c6609
    container_name: lidarr-downloader
    environment:
      <<: *env
      LIDARR_URL: http://lidarr:8686
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      DOWNLOAD_PATH: /data/downloads/youtube
      LIDARR_PATH: /data/media/music
    volumes:
      - ${APPDATA}/music/lidarr-downloader:/config
      - *media
    ports:
      - "127.0.0.1:5005:5000"
    networks: [media_net]
    labels: *nas
    logging: *logging
    restart: unless-stopped

networks:
  media_net:
    name: media_net
    external: true
