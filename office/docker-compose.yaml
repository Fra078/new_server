# Rete propria (office_default): nessun accesso agli altri servizi.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-office: &office
  type: bind
  source: ${OFFICE_PATH}
  target: /data
  bind: { create_host_path: false }

services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.12@sha256:fc8c3a46c16bbdf97362b20c50164e97de9c1dd5f63230d28a4cb15248b53ec3
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8345:80"
    volumes:
      - <<: *office
        target: /srv
      - ${APPDATA}/office/filebrowser/filebrowser.db:/filebrowser.db
      - ${APPDATA}/office/filebrowser/settings.json:/config/settings.json
    labels:
      homeserver.requires-nas: "true"
    logging: *logging
    restart: unless-stopped

  webdav:
    image: hacdias/webdav:v5.17.3@sha256:3b70d2a3afd5bb2f8b3aadb621baa3788c2248b30da3a4698352fc96fef0de40
    container_name: webdav
    ports:
      - "127.0.0.1:8660:8080"
    volumes:
      - *office
      - ${APPDATA}/office/webdav/config.yml:/config.yml
    labels:
      homeserver.requires-nas: "true"
    logging: *logging
    restart: unless-stopped
