# Rete propria (office_default): nessun accesso agli altri servizi.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-office: &office
  type: bind
  source: ${OFFICE_PATH}
  target: /data
  bind: { create_host_path: false }

services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:8345:80"
    volumes:
      - <<: *office
        target: /srv
      - ${APPDATA}/office/filebrowser/filebrowser.db:/filebrowser.db
      - ${APPDATA}/office/filebrowser/settings.json:/config/settings.json
    labels:
      homeserver.requires-nas: "true"
    logging: *logging
    restart: unless-stopped

  webdav:
    image: hacdias/webdav:v5.11.10@sha256:2b708c56b4f36cd75c56d29f22ca1b7bd364782ee15c184182a4187a03538fde
    container_name: webdav
    ports:
      - "127.0.0.1:8660:8080"
    volumes:
      - *office
      - ${APPDATA}/office/webdav/config.yml:/config.yml
    labels:
      homeserver.requires-nas: "true"
    logging: *logging
    restart: unless-stopped
